<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bypass8 - SCUM Bunker Solver</title>
    <style>
        :root {
            --gold: #bda36a;
            --bg: #121212;
            --green: #00ff41;
            --red: #ff4444;
            --blue: #44ffff;
            --panel: #222;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .machine {
            background: var(--panel);
            border: 5px solid #444;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.7);
            width: 500px;
        }

        .header-section {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .display {
            background: #000;
            border: 2px solid var(--gold);
            padding: 8px;
            text-align: center;
            flex: 1;
        }

        .display label {
            display: block;
            font-size: 10px;
            color: var(--gold);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input {
            background: #111;
            border: 1px solid #444;
            color: var(--green);
            padding: 8px;
            width: 85%;
            text-align: center;
            font-size: 18px;
            font-family: inherit;
            outline: none;
        }

        input.red-text { color: var(--red); }
        input.blue-text { color: var(--blue); }

        .row {
            display: grid;
            grid-template-columns: 50px 1fr 1fr 80px;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
            background: #2a2a2a;
            padding: 5px;
            border-radius: 4px;
        }

        .sw-num { color: #888; font-size: 12px; text-align: center; font-weight: bold; }

        .led {
            width: 22px;
            height: 22px;
            background: #311;
            border-radius: 4px;
            margin: auto;
            border: 1px solid #000;
            transition: 0.3s;
        }

        .led.on {
            background: var(--green);
            box-shadow: 0 0 15px var(--green);
        }

        button {
            width: 100%;
            padding: 20px;
            background: var(--gold);
            border: none;
            color: black;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            border-radius: 4px;
        }

        button:hover { background: #d1b883; }

        #msg {
            text-align: center;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
        }

        .footer-info {
            font-size: 10px;
            color: #555;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="machine">
    <div class="header-section">
        <div class="display">
            <label>Input</label>
            <input type="text" id="inp" value="240">
        </div>
        <div class="display">
            <label>Goal Red (A)</label>
            <input type="text" id="ga" value="175" class="red-text">
        </div>
        <div class="display">
            <label>Goal Blue (B)</label>
            <input type="text" id="gb" value="100" class="blue-text">
        </div>
    </div>

    <div id="rows-container">
        <script>
            for(let i=7; i>=0; i--) {
                document.write(`
                    <div class="row">
                        <span class="sw-num">SW ${i+1}</span>
                        <input type="text" id="r${i}a" class="red-text" placeholder="+0">
                        <input type="text" id="r${i}b" class="blue-text" placeholder="+0">
                        <div id="l${i}" class="led"></div>
                    </div>
                `);
            }
        </script>
    </div>

    <button onclick="solve()">CALCULAR BYPASS</button>
    <div id="msg"></div>

    <div class="footer-info">
        Lógica Secuencial: ARRIBA (SW8) → ABAJO (SW1)<br>
        Bypass8 v1.0 - SCUM Specialized Tool
    </div>
</div>

<script>
function op(v, s) {
    s = s.trim().toLowerCase().replace('x', '*');
    if(!s || s === '0') return v;
    if(!isNaN(s)) return v + parseFloat(s);
    try { 
        return new Function('v', `return v ${s}`)(v); 
    } catch(e) { return v; }
}

function solve() {
    const input = parseFloat(document.getElementById('inp').value);
    const goalA = parseFloat(document.getElementById('ga').value);
    const goalB = parseFloat(document.getElementById('gb').value);
    const msg = document.getElementById('msg');
    
    let rows = [];
    for(let i=0; i<8; i++) {
        rows.push({
            a: document.getElementById(`r${i}a`).value,
            b: document.getElementById(`r${i}b`).value
        });
        document.getElementById(`l${i}`).className = 'led';
    }

    // Probar las 256 combinaciones
    for(let i=0; i<256; i++) {
        let curA = input;
        let curB = input;

        // EJECUCIÓN SIEMPRE DE ARRIBA (7) A ABAJO (0)
        for(let j=7; j>=0; j--) {
            if((i >> j) & 1) {
                curA = op(curA, rows[j].a);
                curB = op(curB, rows[j].b);
            }
        }

        if(Math.round(curA) === goalA && Math.round(curB) === goalB) {
            msg.innerText = "ACCESO CONCEDIDO";
            msg.style.color = "var(--green)";
            for(let j=0; j<8; j++) {
                if((i >> j) & 1) document.getElementById(`l${j}`).className = 'led on';
            }
            return;
        }
    }
    
    msg.innerText = "DATOS INVÁLIDOS";
    msg.style.color = "var(--red)";
}
</script>

</body>
</html>
